- hosts: master
  become: yes
  vars:
    alertmanager_smtp_from: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_FROM') }}"
    alertmanager_smtp_username: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_USERNAME') }}"
    alertmanager_smtp_password: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_PASSWORD') }}"
    alertmanager_smtp_to: "{{ lookup('ansible.builtin.env', 'ALERTMANAGER_SMTP_TO') }}"
  tasks:
    - name: Require SMTP configuration on the Ansible controller
      ansible.builtin.assert:
        that:
          - alertmanager_smtp_from | length > 0
          - alertmanager_smtp_username | length > 0
          - alertmanager_smtp_password | length > 0
          - alertmanager_smtp_to | length > 0
        fail_msg: Set ALERTMANAGER_SMTP_FROM, ALERTMANAGER_SMTP_USERNAME, ALERTMANAGER_SMTP_PASSWORD, and ALERTMANAGER_SMTP_TO before running this playbook.
      no_log: true

    - name: Apply Alertmanager configuration
      block:
        - name: Render Alertmanager configuration on the master
          ansible.builtin.template:
            src: ../manifests/alertmanager-config.yaml.j2
            dest: /tmp/alertmanager.yaml
            mode: '0600'
          no_log: true

        - name: Apply Alertmanager Secret to Kubernetes without client-side plaintext metadata
          ansible.builtin.shell: >-
            set -o pipefail &&
            kubectl --kubeconfig=/etc/kubernetes/admin.conf
            create secret generic
            alertmanager-monitoring-kube-prometheus-alertmanager
            --namespace monitoring
            --from-file=alertmanager.yaml=/tmp/alertmanager.yaml
            --dry-run=client --output yaml |
            kubectl --kubeconfig=/etc/kubernetes/admin.conf
            apply --filename -
          args:
            executable: /bin/bash
          no_log: true
      always:
        - name: Remove temporary Alertmanager configuration
          ansible.builtin.file:
            path: /tmp/alertmanager.yaml
            state: absent

    - name: Restart Alertmanager pod
      ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf delete pod -l app.kubernetes.io/name=alertmanager -n monitoring --wait=true
      no_log: true

    - name: Wait for Alertmanager to become ready
      ansible.builtin.command: >-
        kubectl --kubeconfig=/etc/kubernetes/admin.conf
        wait --for=condition=Ready pod
        -l app.kubernetes.io/name=alertmanager
        -n monitoring --timeout=120s
      changed_when: false
