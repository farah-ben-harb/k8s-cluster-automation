apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-monitoring-kube-prometheus-alertmanager
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_from: 'ihebbelaid3@gmail.com'
      smtp_auth_username: 'ihebbelaid3@gmail.com'
      smtp_auth_password: 'deamdoimridrtwwf'
      smtp_require_tls: true

    route:
      receiver: "email"
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - matchers:
            - alertname="Watchdog"
          receiver: "null"
