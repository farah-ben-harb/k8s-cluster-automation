name: Validate automation

on:
  push:
    branches:
      - main
      - k8s-cluster-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ansible-core==2.17.14 pyyaml

      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path('k8s-heat.yaml'), Path('site.yml')]
          paths += sorted(Path('playbooks').glob('*.yml'))
          paths += sorted(Path('manifests').glob('*.yaml'))

          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'validated {path}')
          PY

      - name: Check Ansible syntax
        run: |
          ansible-playbook --syntax-check -i inventory/hosts.ini site.yml
          ansible-playbook --syntax-check -i inventory/hosts.ini playbooks/13-alertmanager-email.yml

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check deployment script
        run: shellcheck deploy.sh

      - name: Scan repository for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --redact --no-banner
