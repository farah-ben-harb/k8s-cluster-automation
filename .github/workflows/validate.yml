name: Validate automation

on:
  push:
    branches:
      - main
      - k8s-cluster-hardening
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-validation:
    name: Static validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools
        run: python -m pip install --disable-pip-version-check ansible-core==2.17.14 pyyaml

      - name: Parse YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          paths = [Path('k8s-heat.yaml'), Path('site.yml')]
          paths += sorted(Path('playbooks').glob('*.yml'))
          paths += sorted(Path('manifests').glob('*.yaml'))

          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
              print(f'validated {path}')
          PY

      - name: Check Ansible syntax
        run: |
          ansible-playbook --syntax-check -i inventory/hosts.ini site.yml
          ansible-playbook --syntax-check -i inventory/hosts.ini playbooks/13-alertmanager-email.yml

      - name: Render Alertmanager template with dummy values
        run: |
          ansible localhost -c local -m ansible.builtin.template \
            -a "src=manifests/alertmanager-config.yaml.j2 dest=/tmp/alertmanager.yaml mode=0600" \
            -e 'alertmanager_smtp_from=ci-sender@example.invalid' \
            -e 'alertmanager_smtp_username=ci-sender@example.invalid' \
            -e 'alertmanager_smtp_password=ci-only-placeholder' \
            -e 'alertmanager_smtp_to=ci-receiver@example.invalid'
          python - <<'PY'
          from pathlib import Path
          import yaml

          config = yaml.safe_load(Path('/tmp/alertmanager.yaml').read_text(encoding='utf-8'))
          assert config['global']['smtp_require_tls'] is True
          assert config['receivers'][1]['email_configs'][0]['to'] == 'ci-receiver@example.invalid'
          assert 'apiVersion' not in config
          print('validated rendered Alertmanager configuration')
          PY

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Check deployment script
        run: shellcheck deploy.sh

      - name: Scan current checkout for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --no-git --source=/repo --redact --no-banner
